name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Tests on SQLite
        run: python -m unittest test_travel_buddy -v
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tb_test
        run: python -m unittest test_travel_buddy -v
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tb_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine('postgresql+psycopg://postgres:postgres@localhost:5432/tb_test')
          with e.begin() as c:
              c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public;'))
          PY
          flask --app app db upgrade
