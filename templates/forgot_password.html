{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-7 col-lg-5 mx-auto">
        <div class="card p-4 p-md-5">
            <h1 class="page-title mb-2">Reset password</h1>
            <p class="text-muted fw-medium mb-4">Enter your {{ EMAIL_HINT }} email and we'll send you a 6-digit code.</p>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label class="form-label" for="email">College email</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="{{ EMAIL_EXAMPLE }}">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Send code</button>
            </form>
            <p class="text-center mt-3 mb-0"><a href="{{ url_for('login') }}" class="fw-semibold">Back to log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
