{% extends "base.html" %}

{% block title %}Report{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card p-4 p-md-5">
            <h1 class="page-title mb-2">Report {{ other.public_name }}</h1>
            <p class="text-muted fw-medium mb-4">Reports are confidential. {{ other.public_name }} won't be told who reported them. If you're in immediate danger, call 112.</p>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">What happened?</label>
                    {% for r in reasons %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="reason" id="r{{ loop.index }}" value="{{ r }}" required>
                        <label class="form-check-label" for="r{{ loop.index }}">{{ r }}</label>
                    </div>
                    {% endfor %}
                </div>
                <div class="mb-3">
                    <label class="form-label">Details (optional)</label>
                    <textarea name="details" class="form-control" rows="3" maxlength="2000"></textarea>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="also_block" id="also_block" checked>
                    <label class="form-check-label" for="also_block">Also block them</label>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary btn-lg">Submit report</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary btn-lg">Back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
